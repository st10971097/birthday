<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Adventure</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#f8f6f2,#fffaf5);
    font-family:"Noto Serif TC",serif;
}

.card{

    width:90%;
    max-width:520px;

    background:white;
    border-radius:25px;
    padding:40px;

    box-shadow:
    0 15px 40px rgba(0,0,0,.08);

}

h1{

text-align:center;
font-size:34px;
margin-bottom:10px;

}

.subtitle{

text-align:center;
color:#888;
margin-bottom:35px;

}

.section{

margin-top:25px;

}

.section h2{

font-size:22px;
margin-bottom:10px;

}

p{

line-height:1.8;

}

.rule{

padding-left:20px;

}

.rule li{

margin:12px 0;

}

.score{

background:#fafafa;
padding:18px;
border-radius:15px;
margin-top:15px;

}

.score div{

display:flex;
justify-content:space-between;
margin:15px 0;
font-size:18px;

}

.footer{

margin-top:35px;
text-align:center;
font-size:20px;
font-weight:bold;

}

.start{

margin-top:35px;
background:#222;
color:white;
text-align:center;
padding:18px;
border-radius:15px;
font-size:20px;
letter-spacing:2px;

}

</style>

</head>

<body>

<div class="card">

<h1>🎂 生日旅行尋寶</h1>

<div class="subtitle">
Welcome, Explorer.
</div>

<div class="section">

<h2>📜 遊戲規則</h2>

<p>

今天，你將化身成一位探險家。

房間裡藏著 <b>3 張便利貼</b>，
每張都需要依照謎題找到它們。

每找到一張，
即可獲得 <b>2 分</b>。

</p>

<ul class="rule">

<li>找到 1 張：＋2 分</li>
<li>找到 2 張：＋4 分</li>
<li>找到 3 張：＋6 分</li>

</ul>

</div>

<div class="section">

<h2>✈️ 旅行獎勵</h2>

<div class="score">

<div>
<span>🏝️ 6 分</span>
<span>富國島旅行</span>
</div>

<div>
<span>🌄 3 分</span>
<span>花東旅行</span>
</div>

<div>
<span>🏮 1 分</span>
<span>台南旅行</span>
</div>

</div>

</div>

<div class="footer">

有些答案，
藏在每天都經過，
卻從未仔細觀察的地方。

</div>

<div class="start">

旅程，即將開始 ❤️

</div>

</div>

</body>
</html>
